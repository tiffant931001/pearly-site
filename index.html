<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearly 作品網站</title>
    <!-- 網路字體:Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Dancing+Script:wght@700&family=Silkscreen:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 上方導覽列 -->
    <div class="header">
        <div>
            <div class="issue">ISSUE 10 · OCT 2026</div>
            <a class="site-name" href="index.html">Pearly</a>
        </div>
        <div class="nav">
            <a href="about.html">關於我</a>
            <a href="pearly.html">Pearly</a>
            <a href="links.html">網站連結</a>
        </div>
        <a class="ig" href="https://www.instagram.com/negi._.404/" target="_blank">IG</a>
    </div>

    <div class="content">

        <!-- 封面:左邊 logo,右邊角色 -->
        <div class="cover">
            <div class="logo-card">
                <img class="heart" src="images/heart.svg" alt="愛心">
                <div class="logo-text">Pearly</div>
                <div class="logo-sub">POCKET MONEY MAGAZINE</div>
                <div class="logo-desc">我的半自動記帳 App 作品集</div>
            </div>
            <!-- 角色卡:pet.js 會把 Pearly App 的會動角色放進來;點=跳、連點=頭暈、長按=施魔法、太久沒點=睡覺 -->
            <div class="character-card">
                <div class="pet"><img src="images/pearly.png" alt="Pearly 角色"></div>
            </div>
        </div>

        <!-- 歡迎 -->
        <div class="card">
            <div class="tag">歡迎</div>
            <p>Pearly 是我為自己做的半自動記帳 App。把手機的付款通知貼進來,App 會整理成一筆一筆的消費,記帳不再麻煩。整個畫面像一本口袋零用錢雜誌,可愛的角色 Pearly 會陪你一起存錢。</p>
        </div>

        <!-- 作品預覽 -->
        <div class="card">
            <div class="tag">作品預覽</div>
            <div class="preview-row">
                <div class="shot"><img src="images/home.png" alt="Pearly 首頁畫面"></div>
                <div class="shot"><img src="images/detail.png" alt="Pearly 明細畫面"></div>
                <div class="shot"><img src="images/chart.png" alt="Pearly 圖表畫面"></div>
            </div>
            <p class="more">想看更多,請到上方 <a href="pearly.html">Pearly</a> 頁面</p>
        </div>

    </div>

    <!-- 頁尾 -->
    <div class="footer">PEARLY · 2026</div>

    <!-- 角色動畫(char13.js、snd10.js 來自 Pearly App) -->
    <script src="pet.js"></script>

</body>
</html>
